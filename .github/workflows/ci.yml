name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint and Type Check
        run: |
          uv run ruff check .
          uv run mypy src
          uv run lint-imports
      - name: Unit, Agent & E2E Tests
        run: uv run pytest tests/unit tests/agents tests/e2e -v
