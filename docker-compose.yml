services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pawdesk
      MYSQL_USER: pawdesk
      MYSQL_PASSWORD: pawdesk
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8000:8000"]

  worker:
    build: .
    env_file: .env
    command:
      [
        "celery",
        "-A",
        "pawdesk.bootstrap.worker:celery_app",
        "worker",
        "-Q",
        "inbound,outbound,default",
        "-c",
        "4",
        "-l",
        "INFO",
      ]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    env_file: .env
    command: ["celery", "-A", "pawdesk.bootstrap.worker:celery_app", "beat", "-l", "INFO"]
    depends_on:
      redis:
        condition: service_healthy

  adk-web:
    build: .
    profiles: ["dev"]
    env_file: .env
    command: ["adk", "web", "adk_dev", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8001:8000"]

volumes:
  mysql_data:
